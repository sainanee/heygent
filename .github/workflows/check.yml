name: check

# Every pull request: the scripts' tests, the pin rules, each server.env (by this repo's schema check and by the pinned
# image's own config loader), the passed-on-staging.txt rule, and shellcheck. No secrets: this runs pull request code.
# (fly config validate needs a Fly token, so it runs in deploy.yml, on main only.)
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - name: script tests
        run: npm test

      - name: pins (digests only; production pins passed on staging)
        run: node --experimental-strip-types --disable-warning=ExperimentalWarning scripts/check-pins.ts .

      - name: server.env schema
        run: node --experimental-strip-types --disable-warning=ExperimentalWarning scripts/check-env.ts .

      - name: server.env against the pinned image's own config loader
        # The server's loadConfig (apps/server/src/config.ts) at exactly the pinned build, with stand-ins for the secrets
        # (never real ones). A folder with no image yet has nothing to check against.
        run: |
          set -euo pipefail
          for dir in servers/*/; do
            dir="${dir%/}"
            if [ ! -f "$dir/image" ]; then echo "$dir: no image yet"; continue; fi
            image="$(cat "$dir/image")"
            standins=(-e DATABASE_URL=postgres://stand-in -e PARLEY_SECRET_KEY=stand-in-stand-in-stand-in-stand-in)
            if grep -qx 'PARLEY_MODE=test' "$dir/server.env"; then
              standins+=(-e "PARLEY_TEST_KEYS={\"stand-in\":\"$(printf 'A%.0s' $(seq 43))\"}")
            fi
            echo "$dir: $image"
            docker run --rm --env-file "$dir/server.env" "${standins[@]}" "$image" \
              node --experimental-strip-types --disable-warning=ExperimentalWarning --input-type=module \
              -e "const m = await import('./apps/server/src/config.ts'); m.loadConfig(process.env); console.log('config ok');"
          done

      - name: passed-on-staging.txt changes only by appending one digest (conformance) or deleting lines (delist)
        # Appends come from the conformance workflow's pull request: a conformance/* branch of this repository that
        # changes nothing else and appends exactly one new digest. Delisting is the owner's: a delist/* branch of this
        # repository whose change to the file only deletes lines (it may re-pin servers too; check-pins then refuses a
        # production pin left on a delisted digest). Anything else is refused. (A speed bump, not the lock: the lock is
        # the main ruleset and the owner's review.)
        if: github.event_name == 'pull_request'
        env:
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # The checkout is the pull request merged into its base; HEAD^1 is that base.
          if git diff --quiet HEAD^1 HEAD -- passed-on-staging.txt; then echo "passed-on-staging.txt unchanged"; exit 0; fi
          fail() { echo "passed-on-staging.txt: $*" >&2; exit 1; }
          [ "$HEAD_REPO" = "$REPO" ] || fail "changed only from a branch of $REPO"
          base="$(git show HEAD^1:passed-on-staging.txt)"
          case "$HEAD_REF" in
            conformance/*)
              [ "$(git diff --name-only HEAD^1 HEAD)" = passed-on-staging.txt ] || fail "a conformance pull request changes nothing else"
              line="$(tail -n 1 passed-on-staging.txt)"
              [[ "$line" =~ ^sha256:[0-9a-f]{64}$ ]] || fail "the appended line is not a digest"
              [ "$(cat passed-on-staging.txt)" = "$base"$'\n'"$line" ] || fail "exactly one line may be appended, nothing else changed"
              ! grep -qxF "$line" <(printf '%s\n' "$base") || fail "$line is already listed"
              echo "appends $line"
              ;;
            delist/*)
              # As sorted line multisets: the new file holds no line the base lacks, and the base loses at least one.
              base_lines="$(printf '%s\n' "$base" | sort)"
              new_lines="$(sort passed-on-staging.txt)"
              added="$(comm -13 <(printf '%s\n' "$base_lines") <(printf '%s\n' "$new_lines"))"
              removed="$(comm -23 <(printf '%s\n' "$base_lines") <(printf '%s\n' "$new_lines"))"
              [ -z "$added" ] || fail "a delist pull request only deletes lines"
              [ -n "$removed" ] || fail "a delist pull request deletes at least one line"
              printf '%s\n' "$removed" | sed 's/^/delists /'
              ;;
            *) fail "changed only from a conformance/* (append) or delist/* (delete) branch" ;;
          esac

      - name: shellcheck
        run: |
          command -v shellcheck >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck; }
          shellcheck scripts/*.sh
